# Copy this folder to ./credentials/ (gitignored) and fill it in.
# Generate a NEW upload key per app — never reuse another app's keystore:
#   keytool -genkeypair -v -storetype PKCS12 -keystore credentials/release.keystore \
#     -alias upload -keyalg RSA -keysize 2048 -validity 10000
# Paths are relative to the project root. Back the keystore + passwords up off-machine:
# losing the upload key means asking Play support to reset it.
storeFile=credentials/release.keystore
storePassword=CHANGE_ME
keyAlias=upload
keyPassword=CHANGE_ME
